name: Build and Release
on:
  push:
    branches:
      - main  # This tells it to run every time you push code to main
    tags:
      - 'v*'
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20 # Stable version for builders

      - name: Install Dependencies
        run: |
          npm install
          cd electron
          npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync electron

      - name: Build and Publish Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd electron
          npm run build
          npm run electron:make