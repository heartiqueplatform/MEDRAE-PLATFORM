<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .splash {
            text-align: center;
            animation: fadeIn 0.5s ease-in;
        }

        .splash img {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .splash h1 {
            margin-top: 24px;
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .splash h1 span {
            color: #ef4444;
        }

        .splash .tagline {
            margin-top: 8px;
            font-size: 14px;
            color: #4a4a6a;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .splash .sub-tagline {
            margin-top: 4px;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="splash">
        <img src="/pwa-192x192.png" alt="Medrae Nursing Logo">
        <h1>Medrae <span>Nursing</span></h1>
        <p class="tagline">Supporting Your Entire Nursing Journey</p>
        <p class="sub-tagline">From Student to Registered Nurse</p>
    </div>
</body>

</html>
