<!DOCTYPE html>
<html lang="en" class="bg-white dark:bg-black">
  <head>
    <link rel="icon" href="/icon-512.jpg" type="image/jpg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

    <!-- Primary Meta -->
    <title>Medrae | Medical Education, Clinical Skills, Careers, Certificates, Professional Growth</title>
    <meta name="description" content="Medrae is a professional medical education and career network. Access clinical training, certifications, jobs, internships, and tools for continuous professional growth." />
    <meta name="author" content="Medrae" />
    <meta name="keywords" content="medical education, clinical skills, healthcare careers, medical jobs, internships, medical certificates, professional development, Medrae" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://medrae.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Medrae – Medical Education and Career Network" />
    <meta property="og:description" content="Medrae connects medical professionals to education, clinical training, and career opportunities. Advance your skills and grow your professional profile." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://medrae.com/" />
    <meta property="og:image" content="/assets/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@medrae_network" />
    <meta name="twitter:title" content="Medrae – Medical Education and Career Network" />
    <meta name="twitter:description" content="Medrae empowers medical professionals through clinical education, certifications, and career growth opportunities." />
    <meta name="twitter:image" content="/assets/og-image.png" />

    <!-- PWA / Mobile -->
    <meta name="theme-color" content="#1e90ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Schema.org for Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Medrae",
      "url": "https://medrae.com/",
      "logo": "https://medrae.com/icon-512.png",
      "description": "Medrae is a professional medical education and career network offering clinical skills training, certifications, and healthcare opportunities.",
      "sameAs": [
        "https://twitter.com/medrae_network"
      ]
    }
    </script>

    <!-- JS solid fallback & theme-based gradient -->
    <script>
      const darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;

      document.documentElement.style.backgroundColor = darkMode ? '#000' : '#fff';
      document.body.style.backgroundColor = darkMode ? '#000' : '#fff';

      const gradient = darkMode 
        ? 'linear-gradient(135deg, #003366, #0059b3, #0a1f2e)' 
        : 'linear-gradient(135deg, #1e90ff, #4dd2ff, #00aaff)';

      const styleEl = document.createElement('style');
      styleEl.innerHTML = `
        html, body, #root {
          height: 100%;
          margin: 0;
          background: ${gradient};
          background-size: 400% 400%;
          animation: glow 6s ease-in-out infinite alternate;
        }
        @keyframes glow {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }
      `;
      document.head.appendChild(styleEl);
    </script>
  </head>

  <body class="bg-white dark:bg-black" style="margin:0;">
    <div id="root" style="height:100%;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
