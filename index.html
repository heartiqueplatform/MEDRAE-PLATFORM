<body style="margin:0;">
  <!-- Splash Screen -->
  <div id="splash" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: hsl(210,20%,98%);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    font-weight: bold;
    color: hsl(215,25%,27%);
  ">
    Loading Heartique...
  </div>

  <!-- React root -->
  <div id="root" style="height:100%;"></div>

  <!-- Main React entry -->
  <script type="module" src="/src/main.tsx"></script>

  <!-- Dark mode detection for splash -->
  <script>
    const splash = document.getElementById('splash');
    const darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
    splash.style.backgroundColor = darkMode ? 'hsl(215,28%,8%)' : 'hsl(210,20%,98%)';
    splash.style.color = darkMode ? 'hsl(210,40%,95%)' : 'hsl(215,25%,27%)';
  </script>
</body>
