<head>
  <meta charset="UTF-8" />

  <link rel="icon" href="/icon-512.jpg" type="image/jpg" />
  <title>Medrae Medical Education, Clinical Skills, Careers, Certificates, Professional Growth</title>

  <meta name="description"
    content="Medrae is a professional medical education and career network. Access clinical training, certifications, jobs, internships, and tools for continuous professional growth." />

  <meta name="keywords"
    content="medical education, clinical skills, healthcare careers, medical jobs, internships, medical certificates, professional development, Medrae" />
  <link rel="canonical" href="https://medrae.com/" />

  <meta property="og:title" content="Medrae – Medical Education and Career Network" />
  <meta property="og:description"
    content="Medrae connects medical professionals to education, clinical training, and career opportunities. Advance your skills and grow your professional profile." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://medrae.com/" />
  <meta property="og:image" content="/assets/og-image.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@medrae_network" />
  <meta name="twitter:title" content="Medrae – Medical Education and Career Network" />
  <meta name="twitter:description"
    content="Medrae empowers medical professionals through clinical education, certifications, and career growth opportunities." />

  <meta name="theme-color" content="#1e90ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />


  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Medrae",
      "url": "https://medrae.com/",
      "logo": "https://medrae.com/icon-512.png",
      "description": "Medrae is a professional medical education and career network offering clinical skills training, certifications, and healthcare opportunities.",
      "sameAs": ["https://twitter.com/medrae_network"]
    }
  </script>
</head>

<body style="margin:0; height:100%;">
  <div id="root" style="height:100%;"></div>

  <!-- ✅ Load React app with offline-safe fallback -->
  <script type="module">
    import("/src/main.tsx");
  </script>
  <!-- ✅ Lock theme and gradient splash BEFORE paint -->
  <script>
    // Determine user theme immediately
    let userTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (!userTheme) userTheme = systemPrefersDark ? 'dark' : 'light';
    document.documentElement.classList.add(userTheme);

    // Default background to prevent flash
    const bgColor = userTheme === 'dark' ? '#000' : '#fff';
    document.documentElement.style.backgroundColor = bgColor;
    document.body.style.backgroundColor = bgColor;

    // Show animated gradient for first-time visitors
    const firstVisit = !localStorage.getItem('hasVisited');
    if (firstVisit) {
      localStorage.setItem('hasVisited', 'true');
      const gradient = userTheme === 'dark'
        ? 'linear-gradient(135deg, #003366, #0059b3, #0a1f2e)'
        : 'linear-gradient(135deg, #1e90ff, #4dd2ff, #00aaff)';
      const styleEl = document.createElement('style');
      styleEl.innerHTML = `
          html, body, #root {
            height: 100%;
            margin: 0;
            background: ${gradient};
            background-size: 400% 400%;
            animation: glow 6s ease-in-out infinite alternate;
          }
          @keyframes glow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
          }
        `;
      document.head.appendChild(styleEl);
    }

  </script>

</body>

</html>
