  <div id="initial-loader"

    <style>
      /* GPU Accelerated Gooey Logic - Makes it smooth on all phones */
      .goo-container {
        filter: url('#goo');
        position: relative;
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        will-change: filter;
      }

      .dot {
        position: absolute;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        animation-iteration-count: infinite;
        animation-duration: 3s;
        animation-timing-function: ease-in-out;
        will-change: transform;
      }

      .dot-1 {
        background-color: #ef4444;
        animation-name: dot-1-move;
      }

      .dot-2 {
        background-color: #3b82f6;
        animation-name: dot-2-move;
      }

      .dot-3 {
        background-color: #8b5cf6;
        animation-name: dot-3-move;
      }

      @keyframes dot-1-move {

        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }

        33% {
          transform: translate(-40px, -20px) scale(1.2);
        }

        66% {
          transform: translate(30px, 40px) scale(0.8);
        }
      }

      @keyframes dot-2-move {

        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }

        33% {
          transform: translate(40px, -20px) scale(0.9);
        }

        66% {
          transform: translate(-30px, 40px) scale(1.1);
        }
      }

      @keyframes dot-3-move {

        0%,
        100% {
          transform: translate(0, 0) scale(1.2);
        }

        33% {
          transform: translate(0px, 50px) scale(0.8);
        }

        66% {
          transform: translate(0px, -50px) scale(1);
        }
      }

      .animate-pulse-slow {
        animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes pulse-slow {

        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: .4;
        }
      }
    </style>

    <!-- Gooey Loader Graphic -->

  <!-- Theme + splash logic preserved -->
  <script>
    (function () {
      let userTheme = localStorage.getItem('theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (!userTheme) {
        userTheme = systemPrefersDark ? 'dark' : 'light';
      }
      document.documentElement.classList.add(userTheme);
      const bgColor = userTheme === 'dark' ? '#000000' : '#ffffff';
      document.documentElement.style.backgroundColor = bgColor;
      document.body.style.backgroundColor = bgColor;

      // Performance marker for analytics
      if (typeof window.performance !== 'undefined') {
        window.medraeLoadStart = performance.now();
      }
    })();

    // INSTANT LOADER REMOVAL - NO delay, NO fade!
    window.hideMedraeLoader = function () {
      const loader = document.getElementById('initial-loader');
      if (loader) {
        loader.style.display = 'none';
        // Optional: Remove from DOM after a tiny delay to let display:none apply
        // setTimeout(() => loader.remove(), 50);
      }
    };
  </script>

  <script>

      if (typeof window.hideMedraeLoader === 'function') {
        window.hideMedraeLoader();

    }, 5000);
  </script>
